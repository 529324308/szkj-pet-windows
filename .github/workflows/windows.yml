name: Windows x64

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: windows-2025
    env:
      SZKJ_PET_ENV: test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Build and test
        shell: pwsh
        run: |
          rustup install stable --profile minimal
          rustup override set stable
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run desktop:pet:build -- --bundles nsis --no-sign -- --locked
      - name: Upload application for signing
        if: vars.SIGNPATH_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/v')
        id: unsigned-application
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: signpath-unsigned-application
          path: src-tauri/target/release/szkj-pet.exe
          if-no-files-found: error
      - name: Sign application
        if: steps.unsigned-application.outcome == 'success'
        uses: SignPath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_APPLICATION_ARTIFACT_SLUG }}
          github-artifact-id: ${{ steps.unsigned-application.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-application
      - name: Bundle the signed executable
        if: steps.unsigned-application.outcome == 'success'
        shell: pwsh
        run: |
          $signed = 'signed-application/szkj-pet.exe'
          $binary = 'src-tauri/target/release/szkj-pet.exe'
          $signature = Get-AuthenticodeSignature -FilePath $signed
          if ($signature.Status -ne 'Valid' -or !$signature.TimeStamperCertificate) {
            throw 'SignPath did not return a trusted, timestamped application.'
          }
          $expected = (Get-FileHash -LiteralPath $signed -Algorithm SHA256).Hash
          Copy-Item -LiteralPath $signed -Destination $binary -Force
          npm exec tauri bundle -- --bundles nsis --no-sign --no-binary-patching
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ((Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash -ne $expected) {
            throw 'NSIS bundling changed the signed application.'
          }
      - name: Upload installer for signing
        if: steps.unsigned-application.outcome == 'success'
        id: unsigned-installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: signpath-unsigned-installer
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
      - name: Sign installer
        if: steps.unsigned-installer.outcome == 'success'
        uses: SignPath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_ARTIFACT_SLUG }}
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-installer
      - name: Verify and stage signed installer
        if: steps.unsigned-installer.outcome == 'success'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath signed-installer -File -Filter '*-setup.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one signed installer.' }
          $installer = $installers[0]
          $signature = Get-AuthenticodeSignature -FilePath $installer.FullName
          $application = Get-AuthenticodeSignature -FilePath 'signed-application/szkj-pet.exe'
          if ($signature.Status -ne 'Valid' -or !$signature.TimeStamperCertificate -or
              $signature.SignerCertificate.Thumbprint -ne $application.SignerCertificate.Thumbprint) {
            throw 'Installer signature, timestamp or publisher verification failed.'
          }
          New-Item -ItemType Directory -Path release | Out-Null
          $download = 'release/SZKJ-Pet-Windows-x64-setup.exe'
          Copy-Item -LiteralPath $installer.FullName -Destination $download
          (Get-FileHash -LiteralPath $download -Algorithm SHA256).Hash.ToLowerInvariant() +
            '  SZKJ-Pet-Windows-x64-setup.exe' | Set-Content -Encoding ascii release/SHA256SUMS.txt
      - name: Upload signed installer
        if: steps.unsigned-installer.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-x64-signed
          path: release/
          if-no-files-found: error
